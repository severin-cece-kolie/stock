<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hors ligne — StockManager</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Material+Symbols+Outlined&display=swap" rel="stylesheet"/>
<style>body{font-family:'Inter',sans-serif;}</style>
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f7f9fb]">
<div class="text-center max-w-md px-6">
  <div class="w-16 h-16 mx-auto mb-6 rounded-full bg-[#eceef0] flex items-center justify-center">
    <span class="material-symbols-outlined text-[#45464d] text-3xl">wifi_off</span>
  </div>
  <h1 class="text-2xl font-bold text-[#191c1e] mb-2">Pas de connexion</h1>
  <p class="text-[#45464d] mb-6">
    StockManager a besoin d'une connexion internet pour afficher des
    données à jour (stock, ventes...). Vérifiez votre connexion puis
    réessayez.
  </p>
  <button onclick="window.location.reload()" class="inline-block px-5 py-2.5 bg-[#131b2e] text-white rounded-lg font-medium hover:opacity-90 transition-opacity">
    Réessayer
  </button>
</div>
</body>
</html>
