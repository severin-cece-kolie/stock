{% extends "base.html" %}
{% block title %}Modifier {{ category.name }}{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <a href="{% url 'suppliers:index' %}?tab=categories" class="text-body-sm text-secondary hover:underline flex items-center gap-1 mb-4">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span> Retour aux catégories
  </a>
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-6">
    <h1 class="font-h2 text-h2 text-on-background mb-6">Modifier {{ category.name }}</h1>
    <form method="post" class="flex flex-col gap-4">
      {% csrf_token %}
      <div class="flex flex-col gap-1"><label class="font-label-caps text-label-caps text-on-surface-variant">Nom</label>{{ form.name }}</div>
      <div class="flex flex-col gap-1"><label class="font-label-caps text-label-caps text-on-surface-variant">Description</label>{{ form.description }}</div>
      <button type="submit" class="px-5 py-2.5 bg-primary text-on-primary rounded-lg font-medium hover:bg-primary/90 transition-colors self-start mt-2">Enregistrer</button>
    </form>
  </div>
</div>
{% endblock %}
